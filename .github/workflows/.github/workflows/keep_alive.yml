name: Keep Streamlit Alive

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          set -e
          echo "Pinging app..."
          curl -sS -L --max-time 20 "https://prophetcurrencytrend.streamlit.app/" > /dev/null
          echo "Done."
